name: Build RC10H

on:
  push:
    paths:
      - '.github/workflows/build-rc10h.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build RC10H from golden RC10
        shell: python
        run: |
          from pathlib import Path
          src = Path('FRED_RC10_ORIGINAL_ICON.user.js').read_text()
          src = src.replace('Sentinel Mobile — FRED RC10 Original Icon Probe', 'Sentinel Mobile — FRED RC10H Real Shield Severity')
          src = src.replace('@version 1.0.0-rc10', '@version 1.0.0-rc10h')
          src = src.replace('PDA probe: exact original RC1 Sentinel shield using original base64 CSS mask implementation', 'Real Sentinel shield; right-edge drag persistence; blue/yellow/red severity test')
          patch = r''';(function(){'use strict';const KEY='fred_rc10h_top';const COLORS=[{name:'BLUE',hex:'#52a2ff'},{name:'YELLOW',hex:'#ffe23b'},{name:'RED',hex:'#ff3030'}];let idx=0;function boot(t){let e=document.getElementById('fred-boot-trace');if(!e){e=document.createElement('div');e.id='fred-boot-trace';e.style.cssText='position:fixed;right:12px;bottom:90px;z-index:2147483647;background:#171b22;color:#fff;border:1px solid #4d5968;border-radius:8px;padding:10px 14px;font:700 14px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif';document.body.appendChild(e)}e.textContent=t}function arm(){const root=document.getElementById('fred-rc10-root'),btn=document.getElementById('fred-rc10-launcher'),shield=btn?.querySelector('.mask');if(!root||!btn||!shield){setTimeout(arm,50);return}root.style.left='auto';root.style.right='7px';root.style.touchAction='none';btn.style.touchAction='none';const saved=parseFloat(localStorage.getItem(KEY));if(Number.isFinite(saved))root.style.top=Math.min(90,Math.max(8,saved))+'%';function paint(){const c=COLORS[idx];shield.style.background=c.hex;shield.style.filter=`drop-shadow(0 0 4px ${c.hex})`;boot(`FRED RC10H • ${c.name} ${c.hex} • drag vertically / tap to cycle`)}let sy=0,st=0,moved=false,active=false;btn.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation()},true);btn.addEventListener('pointerdown',e=>{active=true;moved=false;sy=e.clientY;st=root.getBoundingClientRect().top;try{btn.setPointerCapture(e.pointerId)}catch(_e){} });btn.addEventListener('pointermove',e=>{if(!active)return;const dy=e.clientY-sy;if(Math.abs(dy)>4)moved=true;if(!moved)return;const max=window.innerHeight-root.offsetHeight-8;root.style.top=Math.max(8,Math.min(max,st+dy))+'px'});btn.addEventListener('pointerup',e=>{if(!active)return;active=false;if(moved){const pct=(root.getBoundingClientRect().top/window.innerHeight)*100;root.style.top=pct+'%';localStorage.setItem(KEY,String(pct));boot(`FRED RC10H • POSITION SAVED ${pct.toFixed(1)}%`)}else{idx=(idx+1)%COLORS.length;paint()}try{btn.releasePointerCapture(e.pointerId)}catch(_e){} });btn.addEventListener('pointercancel',()=>{active=false});paint()}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',arm,{once:true});else arm()})();'''
          Path('FRED_RC10H_REAL_SHIELD_SEVERITY.user.js').write_text(src + '\n' + patch + '\n')

      - name: Commit RC10H
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FRED_RC10H_REAL_SHIELD_SEVERITY.user.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Build RC10H real shield severity test"
          git push
