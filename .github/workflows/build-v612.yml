name: Build FRED V6.12 Horizontal Snap
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build-v612.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build from exact V6.11
        shell: python
        run: |
          from pathlib import Path
          src=Path('FRED_V6_11_NUGGET_TRANSPARENT_ASSET.user.js').read_text()
          out=src
          out=out.replace('Sentinel Mobile — FRED V6.11 Nugget Transparent Asset','Sentinel Mobile — FRED V6.12 Horizontal Snap')
          out=out.replace('0.6.11-nugget-transparent-asset','0.6.12-horizontal-snap')
          out=out.replace("const ID='fred-v611', POS='fred.v611.y', MODE='fred.v611.mode';", "const ID='fred-v612', POS='fred.v612.y', MODE='fred.v612.mode', SIDE='fred.v612.side';")
          marker="  d.querySelector('.close').onclick=()=>{d.classList.remove('open');l.style.visibility='visible'};"
          inject="""  const applySide=side=>{side=side==='left'?'left':'right';if(side==='left'){l.style.left='7px';l.style.right='auto'}else{l.style.right='7px';l.style.left='auto'}localStorage.setItem(SIDE,side)};
  applySide(localStorage.getItem(SIDE)||'right');
  l.onpointerdown=e=>{e.preventDefault();const r=l.getBoundingClientRect();drag={id:e.pointerId,sx:e.clientX,sy:e.clientY,sl:r.left,st:parseFloat(l.style.top),m:false};l.style.left=r.left+'px';l.style.right='auto';l.setPointerCapture?.(e.pointerId)};
  l.onpointermove=e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.hypot(dx,dy)>5)drag.m=true;const maxX=Math.max(7,vp().w-l.offsetWidth-7);l.style.left=Math.max(7,Math.min(maxX,drag.sl+dx))+'px';l.style.top=y(drag.st+dy)+'px'};
  l.onpointerup=e=>{if(!drag)return;const m=drag.m;drag=null;localStorage.setItem(POS,parseFloat(l.style.top));if(m){const r=l.getBoundingClientRect();applySide((r.left+r.width/2)<vp().w/2?'left':'right')}else{applySide(localStorage.getItem(SIDE)||'right');d.classList.add('open');l.style.visibility='hidden'}};
"""
          if marker not in out:
              raise SystemExit('close-handler marker missing')
          out=out.replace(marker,inject+marker,1)
          Path('FRED_V6_12_HORIZONTAL_SNAP.user.js').write_text(out)
      - name: Commit generated test
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add FRED_V6_12_HORIZONTAL_SNAP.user.js
          git commit -m 'Build FRED V6.12 horizontal snap test' || exit 0
          git push
