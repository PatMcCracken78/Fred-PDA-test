name: Build FRED RC10I
on: [push]
permissions:
  contents: write
jobs:
  build:
    if: "contains(github.event.head_commit.message, 'RC10I RUN')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build RC10I from RC10H
        shell: python
        run: |
          from pathlib import Path
          src=Path('FRED_RC10H_REAL_SHIELD_SEVERITY.user.js').read_text()
          src=src.replace('FRED RC10H Real Shield Severity','FRED RC10I First Drawer').replace('1.0.0-rc10h','1.0.0-rc10i')
          patch=r'''
;(function(){'use strict';
const ID='fred-rc10i-drawer';
function install(){const btn=document.getElementById('fred-rc10-launcher');if(!btn){setTimeout(install,80);return}const trace=document.getElementById('fred-boot-trace');if(trace)trace.remove();
const s=document.createElement('style');s.textContent=`#${ID}{position:fixed;right:0;top:0;height:100dvh;width:min(78vw,390px);z-index:2147483646;background:linear-gradient(#11161b,#080b0e);border-left:1px solid #46515c;box-shadow:-12px 0 30px #0009;transform:translateX(102%);transition:transform .22s ease;color:#e9edf1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;box-sizing:border-box;padding:18px 14px}#${ID}.open{transform:none}#${ID} .x{position:absolute;right:10px;top:10px;width:34px;height:34px;border:1px solid #48525c;border-radius:7px;background:#161b20;color:#cbd2d8;font-size:24px}#${ID} .brand{margin:28px 2px 18px;padding:14px 6px 12px;text-align:center;border-top:2px solid #59636d;border-bottom:2px solid #303840;background:linear-gradient(#242a2f,#0c0f12)}#${ID} .word{font-family:Impact,"Arial Black",sans-serif;font-size:clamp(31px,9vw,50px);letter-spacing:1px;line-height:1;color:#c8c8c5;text-shadow:0 2px #050505,0 -1px #fff;white-space:nowrap}#${ID} .motto{margin-top:4px;font-size:8px;letter-spacing:1.7px;color:#777f86;font-weight:800}#${ID} .status{border:1px solid #28342e;border-left:4px solid #42d982;background:#0d1511;padding:14px;border-radius:4px}#${ID} .watch{display:flex;align-items:center;gap:9px;color:#55e895;font-size:18px;font-weight:900;letter-spacing:.8px}#${ID} .dot{width:12px;height:12px;border-radius:50%;background:#49df8c;box-shadow:0 0 8px #49df8c77}#${ID} .clear{margin:6px 0 0 21px;color:#d6ddd9;font-size:15px;font-weight:750}`;document.head.appendChild(s);
const d=document.createElement('aside');d.id=ID;d.innerHTML='<button class="x">×</button><div class="brand"><div class="word">SENTINEL</div><div class="motto">OBSERVE • REPORT • INFORM</div></div><div class="status"><div class="watch"><span class="dot"></span>WATCHING</div><div class="clear">ALL CLEAR</div></div>';document.body.appendChild(d);d.querySelector('.x').onclick=e=>{e.stopPropagation();d.classList.remove('open')};let x=0,y=0;btn.addEventListener('pointerdown',e=>{x=e.clientX;y=e.clientY},true);btn.addEventListener('pointerup',e=>{if(Math.hypot(e.clientX-x,e.clientY-y)<5){e.preventDefault();e.stopImmediatePropagation();d.classList.toggle('open')}},true)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install,{once:true});else install()})();
'''
          Path('FRED_RC10I_FIRST_DRAWER.user.js').write_text(src+'\n'+patch)
      - name: Commit
        run: |
          git config user.name "Sentinel Builder"
          git config user.email "actions@users.noreply.github.com"
          git add FRED_RC10I_FIRST_DRAWER.user.js
          git commit -m "Build FRED RC10I first drawer" || exit 0
          git push
