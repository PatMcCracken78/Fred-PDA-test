name: Build FRED V6.6 Nugs Close Test
on:
  push:
    paths:
      - '.github/workflows/build_v66.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build V6.6 from exact V6.5 baseline
        shell: python
        run: |
          from pathlib import Path
          src = Path('FRED_V6_5_MASK_LAUNCHER.user.js').read_text()
          out = src
          out = out.replace('Sentinel Mobile — FRED V6.5 Mask Launcher','Sentinel Mobile — FRED V6.6 Nugs Close Test',1)
          out = out.replace('0.6.5-mask-launcher','0.6.6-nugs-close',1)
          out = out.replace("const ID='fred-v65', POS='fred.v65.y', MODE='fred.v65.mode';","const ID='fred-v66', POS='fred.v66.y', MODE='fred.v66.mode';\nconst NUGS_URL='https://raw.githubusercontent.com/PatMcCracken78/Fred-PDA-test/main/assets/C20BF5FF-D3A4-4F30-BCAD-F297FD6761CD.png';",1)
          old_css = "#${ID} .close{position:fixed;right:0;top:45%;transform:translateY(-50%);width:49px;height:59px;border:1px solid #47535e;border-right:0;border-radius:11px 0 0 11px;background:linear-gradient(#20282e,#10151a);color:#e0e6ea;font-size:31px;display:grid;place-items:center;z-index:3}"
          new_css = "#${ID} .close{position:fixed;right:0;top:45%;transform:translateY(-50%);width:78px;height:96px;border:0;background:transparent;color:transparent;font-size:0;display:grid;place-items:center;z-index:3;padding:0;overflow:visible;touch-action:manipulation}\\n#${ID} .close:before{content:'';width:58px;height:76px;display:block;background:url('${NUGS_URL}') center/contain no-repeat;filter:drop-shadow(-3px 4px 7px rgba(0,0,0,.55));pointer-events:none}\\n#${ID} .close.asset-fail{width:49px;height:59px;border:1px solid #47535e;border-right:0;border-radius:11px 0 0 11px;background:linear-gradient(#20282e,#10151a);color:#e0e6ea;font-size:31px}\\n#${ID} .close.asset-fail:before{display:none}"
          if old_css not in out:
              raise SystemExit('close CSS baseline not found; refusing unsafe build')
          out = out.replace(old_css,new_css,1)
          old_markup = '<button class="close">×</button>'
          new_markup = '<button class="close" aria-label="Close Sentinel" title="Close Sentinel">×</button>'
          if old_markup not in out:
              raise SystemExit('close markup baseline not found; refusing unsafe build')
          out = out.replace(old_markup,new_markup,1)
          hook = "let l=r.querySelector('.fl'),d=r.querySelector('.fd');"
          repl = hook + "\n  const closeBtn=d.querySelector('.close');\n  const nugsProbe=new Image();\n  nugsProbe.onerror=()=>closeBtn?.classList.add('asset-fail');\n  nugsProbe.src=NUGS_URL;"
          if hook not in out:
              raise SystemExit('build hook not found; refusing unsafe build')
          out = out.replace(hook,repl,1)
          Path('FRED_V6_6_NUGS_CLOSE.user.js').write_text(out)
      - name: Sanity check allowed changes
        shell: bash
        run: |
          grep -q "0.6.6-nugs-close" FRED_V6_6_NUGS_CLOSE.user.js
          grep -q "C20BF5FF-D3A4-4F30-BCAD-F297FD6761CD.png" FRED_V6_6_NUGS_CLOSE.user.js
          grep -q "ICON_MASK='data:image/png;base64" FRED_V6_6_NUGS_CLOSE.user.js
          grep -q "const WORDMARK='data:image/webp;base64" FRED_V6_6_NUGS_CLOSE.user.js
      - name: Commit V6.6
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FRED_V6_6_NUGS_CLOSE.user.js
          git commit -m "Build FRED V6.6 Nugs close control" || exit 0
          git push
